<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#059669">
  <title>فهد التميمي — إدارة التمويلات والأقساط</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Splash -->
  <div id="splash" class="splash">
    <div class="splash-logo">
      <img src="assets/icon-192.png" alt="" onerror="this.style.display='none'">
      <div class="splash-title">فهد التميمي</div>
      <div class="splash-sub">إدارة التمويلات والأقساط</div>
    </div>
  </div>

  <!-- Login gate -->
  <div id="lock" class="lock hidden">
    <div class="lock-card">
      <div class="lock-logo"><img src="assets/icon-192.png" alt="" onerror="this.style.display='none'"></div>
      <h1>فهد التميمي</h1>
      <p class="lock-sub">أدخل كلمة المرور للمتابعة</p>
      <input id="lockPw" type="password" inputmode="numeric" placeholder="••••" autocomplete="current-password">
      <button id="lockBtn" class="btn-primary">دخول</button>
      <div id="lockErr" class="lock-err"></div>
    </div>
  </div>

  <!-- App shell -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="القائمة">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
      <div class="brand">
        <span class="brand-mark">ف</span>
        <span class="brand-name">فهد التميمي</span>
      </div>
      <div class="topbar-right">
        <button id="reminderBtn" class="icon-btn" aria-label="التذكيرات">
          <svg viewBox="0 0 24 24"><path d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="reminderDot" class="dot hidden"></span>
        </button>
      </div>
    </header>

    <nav id="drawer" class="drawer">
      <div class="drawer-head">
        <div class="drawer-brand">
          <div class="drawer-mark">ف</div>
          <div>
            <div class="drawer-name">فهد التميمي</div>
            <div class="drawer-role">إدارة التمويلات والأقساط</div>
          </div>
        </div>
      </div>
      <ul class="drawer-nav">
        <li data-route="dashboard"><span class="ico">📊</span> لوحة التحكم</li>
        <li data-route="clients"><span class="ico">👥</span> العملاء</li>
        <li data-route="loans"><span class="ico">💼</span> التمويلات</li>
        <li data-route="installments"><span class="ico">📅</span> الأقساط</li>
        <li data-route="calendar"><span class="ico">🗓️</span> التقويم</li>
        <li data-route="invoices"><span class="ico">🧾</span> الفواتير</li>
        <li data-route="reminders"><span class="ico">🔔</span> التذكيرات</li>
        <li data-route="reports"><span class="ico">📈</span> التقارير</li>
        <li data-route="settings"><span class="ico">⚙️</span> الإعدادات</li>
      </ul>
      <div class="drawer-foot">
        <button id="lockAppBtn" class="btn-ghost small">🔒 قفل التطبيق</button>
        <div class="drawer-ver">v1.0.0 · hsn.pmt</div>
      </div>
    </nav>
    <div id="drawerScrim" class="scrim"></div>

    <main id="view" class="view"></main>

    <!-- Modal host -->
    <div id="modal" class="modal hidden">
      <div class="modal-scrim"></div>
      <div class="modal-body">
        <div id="modalContent"></div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Sheet host (for pickers, actions) -->
    <div id="sheet" class="sheet hidden">
      <div class="sheet-scrim"></div>
      <div class="sheet-body">
        <div class="sheet-handle"></div>
        <div id="sheetContent"></div>
      </div>
    </div>
  </div>

  <!-- Vendor libs (loaded lazily on demand from CDN with local cache) -->
  <script src="js/vendor.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/db.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/views.js"></script>
  <script src="js/invoices.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
