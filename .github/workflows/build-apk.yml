name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android || echo "Android platform already exists"

      - name: Generate app icons and splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#059669' --splashBackgroundColor '#059669' || echo "Assets step failed, continuing"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch Android manifest (permissions + app name)
        run: node scripts/patch-android.js

      - name: Grant gradlew execute permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/fahd-tamimi-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fahd-tamimi-apk
          path: output/fahd-tamimi-v1.0.0.apk
          retention-days: 30
